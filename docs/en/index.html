<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>AI &amp; Dev tools catalog</title>
<style>
/* Grafica: design system «Safe Console» disegnato con Google Stitch (2026-09-27), riportata a
   font di sistema e CSS scritto qui: la pagina non fa nessuna richiesta di rete. */
:root{
  --canvas:#f6f8fa; --panel:#ffffff; --subtle:#eff2f5; --line:#d0d7de; --line-strong:#afb8c1;
  --ink:#1f2328; --text:#1f2328; --muted:#59636e; --accent:#1a7f37;
  --ok:#1a7f37; --ok-bg:#dafbe1; --ok-line:#aceebb;
  --warn:#9a6700; --warn-bg:#fff8c5; --warn-line:#eac54f;
  --bad:#d1242f; --bad-bg:#ffebe9; --bad-line:#ffcecb;
  --star:#9a6700; --focus:#0969da;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#0d1117; --panel:#161b22; --subtle:#21262d; --line:#30363d; --line-strong:#484f58;
    --ink:#f0f6fc; --text:#c9d1d9; --muted:#8b949e; --accent:#3fb950;
    --ok:#3fb950; --ok-bg:rgba(46,160,67,.15); --ok-line:rgba(63,185,80,.4);
    --warn:#d29922; --warn-bg:rgba(187,128,9,.15); --warn-line:rgba(210,153,34,.4);
    --bad:#f85149; --bad-bg:rgba(248,81,73,.12); --bad-line:rgba(248,81,73,.4);
    --star:#e3b341; --focus:#58a6ff;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

/* intestazione */
.bar{background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:grid;gap:6px;padding-block:16px 14px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tag{font:500 12px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--subtle);border:1px solid var(--line);color:var(--muted)}
.tag.ver{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
h1{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px/1.5 var(--mono);color:var(--muted)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.facts b.acc{color:var(--accent)}
.lang{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;font:12px/1 var(--mono)}
.lang a{padding:5px 7px;border:1px solid transparent;border-radius:4px;color:var(--muted);text-decoration:none}
.lang a:hover{background:var(--subtle);color:var(--ink)}
.lang a[aria-current="page"]{border-color:var(--line-strong);background:var(--subtle);color:var(--ink);font-weight:600}

/* ricerca */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:18px 14px}
.field{position:relative;flex:1 1 320px;min-width:0}
.field svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--muted);pointer-events:none}
.field input{width:100%;height:40px;padding:0 44px 0 36px;font:15px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--accent);outline:none}
.field input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
kbd{font:500 11px/1 var(--mono);padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--subtle);color:var(--muted)}
.field kbd{position:absolute;right:10px;top:50%;translate:0 -50%}
.sort{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
.sort select{height:40px;padding:0 10px;font:13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px}

/* colonne */
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
aside{position:sticky;top:12px;display:grid;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
fieldset{margin:0;padding:10px 8px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;gap:1px;min-width:0}
legend{float:left;width:100%;padding:0 6px 8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);font:13px/1.35 var(--sans);text-align:left;cursor:pointer}
.opt:hover:not(:disabled){background:var(--subtle);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--subtle);border-color:var(--line-strong);color:var(--ink);font-weight:600}
.opt:disabled{opacity:.45;cursor:default}
.opt .l{font:600 11px var(--mono);color:var(--accent);flex:none}
.opt .n{margin-left:auto;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.opt .dot{flex:none}

/* risultati */
.results{display:grid;gap:8px;min-width:0}
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:12px var(--mono);color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
.reset{font:12px var(--mono);color:var(--accent);background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer}
.reset:hover{background:var(--subtle)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.card:hover{border-color:var(--line-strong)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.name{font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
a.name:hover{color:var(--accent);text-decoration:underline}
.host{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.cat{margin-left:auto;font:11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--subtle);color:var(--muted);white-space:nowrap}
.desc{margin:0;color:var(--ink);text-wrap:pretty}
.when{margin:0;padding:6px 10px;border-left:2px solid var(--line-strong);background:var(--canvas);border-radius:0 4px 4px 0;color:var(--text);font-size:13px}
.when b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border:1px solid var(--line);border-radius:4px;background:var(--subtle);color:var(--text);font:500 11.5px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.chip.mine{background:none;border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip.orig{background:none;border-style:dashed;color:var(--muted)}
.chip.lic{height:auto;min-height:22px;padding-block:4px;white-space:normal;line-height:1.3;max-width:100%}
.chip svg{width:12px;height:12px;color:var(--star)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:6px;font:13px var(--mono)}

footer{border-top:1px solid var(--line);background:var(--panel)}
footer .wrap{display:grid;gap:4px;padding-block:16px;font:12px/1.6 var(--mono);color:var(--muted)}

@media (max-width:860px){
  .wrap{padding:0 16px}
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;overflow:visible}
  fieldset{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
  legend{padding:0 0 6px}
  .opt{width:auto;padding:5px 9px;border-color:var(--line);border-radius:999px}
  .cat{margin-left:0}
  .field kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      </div>
      <div class="list" id="list"></div>
    </main>
  </div>
</div>

<footer>
  <div class="wrap">
    <div id="foot"></div>
    <div data-t="piede_licenze"></div>
  </div>
</footer>

ostic and works with Claude, GPT, Gemini or local endpoints via Ollama and vLLM.","quando_usarlo":"When you want a coding-agent runtime where you can swap the shell, sandbox or execution loop without rewriting the engine.","url":"https://github.com/deepseek-ai/deepseek-harness","stelle":237364,"ultimo_push":"2026-09-24","licenza":"MIT","linguaggio":"TypeScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"H","nome":"Puter","cosa_fa":"Open-source serverless backend designed for AI-generated apps: a single client library gives access to AI models, user authentication, cloud storage, a NoSQL database and hosting, with no API keys exposed in the frontend. Includes sandboxing, rate limiting and anti-abuse filters by default.","quando_usarlo":"When an agent-generated prototype needs auth, storage and a database without standing up a backend.","url":"https://github.com/HeyPuter/puter","stelle":43604,"ultimo_push":"2026-09-26","licenza":"AGPL-3.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"copyleft"},{"tipo":"repo","macro":"H","nome":"prod-FARM-IOS-Core","cosa_fa":"Self-hosted system for registering real iPhones, viewing them live from the browser and controlling them remotely, with a Postgres-backed scheduler for scheduled publishing. Apache-2.0 license, no lock-in to cloud services.","quando_usarlo":"When you need to orchestrate a fleet of physical iOS devices (testing or automation) from a single dashboard.","url":"https://github.com/Git-Agni/prod-FARM-IOS-Core","stelle":1571,"ultimo_push":"2026-09-07","licenza":"Apache-2.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"F","nome":"davinci-resolve-mcp","cosa_fa":"MCP server that connects any compatible client to DaVinci Resolve Studio: control of edit, color, Fusion and Fairlight, media analysis, markers and render setup. Exposes 377 granular tools or a compact 36-tool mode; MIT license.","quando_usarlo":"When you want an agent to perform editing and color operations inside DaVinci Resolve instead of describing them.","url":"https://github.com/samuelgursky/davinci-resolve-mcp","stelle":3179,"ultimo_push":"2026-09-26","licenza":"MIT","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"F","nome":"anything2explainer","cosa_fa":"Skill for Claude Code and Codex that turns a topic into a motion-graphics explainer video: research, narration, storyboard and shot code, TTS voice with word-aligned subtitles, chapters and a progress bar. Every frame is drawn in Remotion, not generated as pixels.","quando_usarlo":"When you need an explainer video that is reproducible and fixable via code rather than a generated video.","url":"https://github.com/Vincentwei1021/anything2explainer","stelle":2101,"ultimo_push":"2026-09-18","licenza":"NOASSERTION","linguaggio":"TypeScript","stato":"molto_attivo","lic":"ignota"},{"tipo":"repo","macro":"F","nome":"ComfyUI-Ref2VA-VSA","cosa_fa":"ComfyUI custom node that applies sparse attention to the MiniMax H3 model to generate character videos much faster on a single consumer GPU, discarding most of the video data while keeping the reference image intact so the face stays consistent.","quando_usarlo":"When you generate character clips on local hardware and rendering time is the bottleneck.","url":"https://github.com/Kablex/ComfyUI-Ref2VA-VSA","stelle":414,"ultimo_push":"2026-09-16","licenza":"NOASSERTION","linguaggio":"Python","stato":"molto_attivo","lic":"ignota"},{"tipo":"repo","macro":"B","nome":"deepagents","cosa_fa":"LangChain library for building 'deep' agents: explicit planning, a virtual file system, sub-agents and long-running context on top of the basic tool-calling loop.","quando_usarlo":"When a single-loop agent can't handle the task and you need ready-made planning and sub-agents.","url":"https://github.com/langchain-ai/deepagents","stelle":29798,"ultimo_push":"2026-09-27","licenza":"MIT","linguaggio":"Python","stato":"molto_attivo","lic":"libera"} rifiable against the code, not hand-drawn from memory.","url":"https://github.com/tt-a1i/archify","stelle":72515,"ultimo_push":"2026-09-27","licenza":"MIT","linguaggio":"JavaScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"G","nome":"Archify (Salah-XD)","cosa_fa":"Local-first Chrome MV3 extension that analyzes a web app directly from the browser: reconstructs the frontend architecture and assesses client-side security, without data leaving the machine. Covers the case where the source isn't available. Same name as, but unrelated to, the tt-a1i/archify diagram skill.","quando_usarlo":"When you need a sense of the architecture and client-side security of a web app whose repository you don't have — a first look, not a verdict: it can't see the backend.","url":"https://github.com/Salah-XD/archify","stelle":44,"ultimo_push":"2026-08-22","licenza":"Apache-2.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"H","nome":"Recordly","cosa_fa":"Free, open-source screen recorder for Mac, Windows and Linux built for demo videos: follows the cursor and decides where to zoom on its own, smooths mouse movement, highlights clicks and offers a timeline for trimming and speeding up. Exports to MP4 and GIF. Needs two permissions (screen recording and accessibility) for auto-zoom to work; on Linux watch out for Wayland vs X11.","quando_usarlo":"When you need to produce an already 'edited' software demo or tutorial without going through a video editor.","url":"https://github.com/webadderallorg/Recordly","stelle":31488,"ultimo_push":"2026-09-23","licenza":"AGPL-3.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"copyleft"},{"tipo":"repo","macro":"E","nome":"Docling","cosa_fa":"Open-source library (born at IBM Research) that converts complex documents — PDF, DOCX, PPTX, XLSX, HTML, EPUB, images, audio, LaTeX — into Markdown, HTML or structured JSON for LLMs and RAG pipelines. Reconstructs layout, reading order, tables,  start from an extensible platform rather than from scratch.","url":"https://github.com/fleetbase/fleetbase","stelle":3925,"ultimo_push":"2026-09-27","licenza":"AGPL-3.0","linguaggio":"JavaScript","stato":"molto_attivo","lic":"copyleft"},{"tipo":"repo","macro":"G","nome":"Crucix","cosa_fa":"Local OSINT intelligence terminal: every few minutes it collects dozens of public feeds (satellite fire data, air and sea traffic, radiation, conflict zones, economic and market indicators), shows them on a 3D map and correlates signals across domains. Hooked up to an LLM, it sends tiered alerts to Telegram or Discord and responds to commands. No cloud or telemetry.","quando_usarlo":"When you want a situational-awareness dashboard on open sources, with automatic alerts, running on your own machine.","url":"https://github.com/calesthio/Crucix","stelle":12025,"ultimo_push":"2026-05-20","licenza":"AGPL-3.0","linguaggio":"JavaScript","stato":"attivo","lic":"copyleft"},{"tipo":"repo","macro":"C","nome":"SystemOneHarness","cosa_fa":"Harness for 'System One' models (Jev and similar): forces the model to pick an action from a closed list of typed options, tracks confidence and stops when it falls below a threshold instead of making things up. Logs every decision. Runs models locally or via HarnessRouter.","quando_usarlo":"When you automate high-stakes decisions and want constrained, verifiable choices with an explicit refusal below a confidence threshold.","url":"https://github.com/HarnessRouter/SystemOneHarness","stelle":172,"ultimo_push":"2026-09-21","licenza":"Apache-2.0","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"A","nome":"mobile-mcp","cosa_fa":"MCP server that lets agents like Claude Code, Codex, Cursor or Gemini control iOS and Android apps on emulators, simulators and real devices: read the screen, tap, swipe, type, install apps, deep links, logs and recording. Mainly uses the accessibility tree and falls back to screenshots only when needed.","quando_usarlo":"When you want your coding agent to test or drive a mobile app through a single interface for Android and iOS.","url":"https://github.com/mobile-next/mobile-mcp","stelle":7648,"ultimo_push":"2026-09-23","licenza":"Apache-2.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"D","nome":"EvoOntology","cosa_fa":"Research project (RUC Data Lab) that automatically builds and evolves an ontology/semantic layer for agents working on data, so it doesn't have to be maintained by hand. Also available as a plugin for Claude Code and Codex; accompanied by an arXiv paper.","quando_usarlo":"When an agent queries company data and the hand-written semantic layer becomes the bottleneck.","url":"https://github.com/ruc-datalab/EvoOntology","stelle":431,"ultimo_push":"2026-09-23","licenza":"MIT","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"B","nome":"ARTEMIS (Google)","cosa_fa":"Google framework that turns natural-language instructions into reliable Android automations, running end-to-end flows on apps.","quando_usarlo":"When you want to automate or test complete journeys in Android apps by describing them in words instead of writing UI scripts.","url":"https://github.com/google/artemis","stelle":10414,"ultimo_push":"2026-09-12","licenza":"Apache-2.0","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"H","nome":"PDFcn","cosa_fa":"shadcn-style component registry for generating PDFs in React: you copy the components into your project and compose tables, forms, charts, invoices and reports, with the Takumi or Forme renderer. The docs show live previews. It's not a hosted editor: the logic stays in the application.","quando_usarlo":"When a React app needs to produce polished PDFs (invoices, reports) and you don't want to build them from layout primitives.","url":"https://github.com/shadcn-labs/pdfcn","stelle":2233,"ultimo_push":"2026-09-24","licenza":"MIT", l while preserving its meaning, via multilingual LLM rewriting.","quando_usarlo":"When an AI-written draft has that typical artificial tone and you want a first automated editing pass.","url":"https://github.com/asokurasu/text-humanizer","stelle":738,"ultimo_push":"2026-09-26","licenza":"MIT","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"A","nome":"agy-staff","cosa_fa":"Makes Claude Code and Codex use Google's Antigravity CLI (agy) as a fast Gemini assistant to delegate small tasks to.","quando_usarlo":"When your main coding agent is slow or expensive on simple jobs and you want to delegate them to a faster model.","url":"https://github.com/keli-wen/agy-staff","stelle":660,"ultimo_push":"2026-09-18","licenza":"MIT","linguaggio":"JavaScript","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"F","nome":"HotClip","cosa_fa":"Open-source tool that cuts long videos, live-stream replays and podcasts into vertical clips with subtitles, finding the highlights with AI. Local, no watermark.","quando_usarlo":"When you need to cut shorts from long-form content without credit-based services.","url":"https://github.com/xixihhhh/hotclip","stelle":257,"ultimo_push":"2026-09-23","licenza":"AGPL-3.0","linguaggio":"TypeScript","stato":"molto_attivo","lic":"copyleft"},{"tipo":"repo","macro":"C","nome":"Kev","cosa_fa":"Family of Jev-style decision models based on Qwen3.5/3.8 that you can train and run yourself: they return yes/no, choices and ratings as probabilities.","quando_usarlo":"When you want a self-hosted alternative to Jev that you can also retrain on your own domain.","url":"https://github.com/jaredpalmer/kev","stelle":7337,"ultimo_push":"2026-09-27","licenza":"Apache-2.0","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"F","nome":"AutoShorts","cosa_fa":"Local-first desktop app that turns long audio/video recordings into multiple vertical clips, ranking the moments with the most potential. No declared license.","quando_usarlo":"When you want to extract shorts from a long video working on your own machine.","url":"https://github.com/JayWebtech/autoshorts","stelle":886,"ultimo_push":"2026-08-02","licenza":"no license (all rights reserved)","linguaggio":"Rust","stato":"molto_attivo","lic":"chiusa"},{"tipo":"repo","macro":"A","nome":"motion-web","cosa_fa":"Agent skill that teaches how to build 'motion-first' animated sites with Three.js, Canvas 2D, WebGL or CSS and realistic physics, with seven ready-made examples.","quando_usarlo":"When you ask an agent for a site with rich animations and want it to follow proven patterns.","url":"https://github.com/feitangyuan/motion-web","stelle":527,"ultimo_push":"2026-09-15","licenza":"CC BY-NC 4.0","linguaggio":"HTML","stato":"molto_attivo","lic":"limitata"},{"tipo":"repo","macro":"H","nome":"DaC (Dashboard as Code)","cosa_fa":"Dashboards defined as code in YAML and JSX, with a built-in semantic layer: versionable and reviewable like the rest of the code, and editable by an agent.","quando_usarlo":"When you want dashboards under version control instead of configured by hand in a BI tool.","url":"https://github.com/bruin-data/dac","stelle":767,"ultimo_push":"2026-09-25","licenza":"AGPL-3.0","linguaggio":"Go","stato":"molto_attivo","lic":"copyleft"},{"tipo":"repo","macro":"C","nome":"awesome-jev-by-typesafe","cosa_fa":"Collection of use cases, patterns, prompts and starter code for TypeSafe's Jev (triage, routing, yes/no screening).","quando_usarlo":"When you start using Jev or a clone and want concrete examples to start from.","url":"https://github.com/Anil-matcha/awesome-jev-by-typesafe","stelle":862,"ultimo_push":"2026-09-23","licenza":"MIT","linguaggio":"Python","stato":"molto_attivo","lic":"libera"},{"tipo":"repo","macro":"H","nome":"Bruin","cosa_fa":"Open-source tool for end-to-end data pipelines in SQL and Python: ingestion from multiple sources, transformations and quality checks in a single project, self-hosted ge prompt for recreating the project with a coding agent. Bring your own LLM key.","quando_usarlo":"When you want to understand or recreate a GitHub repo by turning it into a prompt ready for an AI coding agent.","url":"https://www.gitreverse.com","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"B","nome":"Runable","cosa_fa":"General-purpose AI agent platform that plans and executes tasks end-to-end: generates sites, videos, slides, images, apps and workflows from a single subscription.","quando_usarlo":"When you want an all-purpose agent that produces complete deliverables without you assembling the toolchain.","url":"https://runable.com","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"F","nome":"Motion","cosa_fa":"AI agent for generating motion-graphics videos from prompts: handles research, design, animation, voiceover and editing, callable from Claude or Cursor via MCP.","quando_usarlo":"When you need a professional animated video without opening After Effects, even driven by Claude via MCP.","url":"https://motion.so","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"F","nome":"Higgsfield AI","cosa_fa":"AI-native creative suite for image and video generation, with an app builder and an MCP server callable from Claude or Cursor to produce content at scale.","quando_usarlo":"When you want to generate videos or creatives in volume and drive them from an agent via MCP.","url":"https://higgsfield.ai","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"F","nome":"Dreamina (CapCut)","cosa_fa":"CapCut's AI video and image generator: long video mode with clips up to a few minutes in a single generation and up to 50 references to keep subjects consistent.","quando_usarlo":"When you need a long, consistent video without stitching separate clips together.","url":"https://dreamina.capcut.com","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"A","nome":"Emergent","cosa_fa":"App builder that generates the complete full-stack system from a plain-language description of a workflow, with a live URL and responsive interface.","quando_usarlo":"When you want a management tool or internal app without building it by hand.","url":"https://emergent.sh","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"G","nome":"North Star","cosa_fa":"OSINT research browser combining visual, identity, crypto and network investigation: a globe with over 250,000 public cameras, cross-platform username search, wallet tracking across dozens of chains, image geolocation and radio tools.","quando_usarlo":"When an open-source investigation needs to cross-reference multiple data types in a single interface.","url":"https://nstarlive.com","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"G","nome":"Fingerprint.to","cosa_fa":"Search engine over public data that runs checks in parallel and streams back the results: usernames or emails across over 700 platforms and people search via public-record sources.","quando_usarlo":"When you need a quick open-source check without waiting for all queries to finish.","url":"https://fingerprint.to","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"F","nome":"Drafted","cosa_fa":"Generates a floor plan from a list of rooms and derives the matching 3D exterior: key positions chosen by hand and walls, doors and hallways completed by AI, with selective regeneration and CAD or PDF export.","quando_usarlo":"When you want to go from a list of rooms to a floor plan and a 3D massing without opening a CAD tool.","url":"https://www.drafted.ai","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"J","nome":"Artificial Analysis","cosa_fa":"Independent index comparing AI models on intelligence, cost per task and generation speed, with charts that cross-reference the different metrics.","quando_usarlo":"When you need to choose a model balancing quality, price and latency instead of looking at a single benchmark.","url":"https://artificialanalysis.ai","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"C","nome":"Homura-30B GGUF","cosa_fa":"30B open-weights agentic model distributed in GGUF quantizations, designed to run locally on consumer hardware or private servers.","quando_usarlo":"When you want a dense model that still runs locally, to pair with an external guardrail.","url":"https://huggingface.co/hyrelabs/Homura-30B-GGUF","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"C","nome":"Jev (TypeSafe AI)","cosa_fa":"Commercial model in early access that generates decisions rather than text: you pass it a state and the closed set of allowed answers, and it returns a typed value with a probability and confidence score, designed to be consumed by code. Accessible via API with pricing on request.","quando_usarlo":"When a pipeline needs a classification or a choice among known options, not a natural-language answer.","url":"https://typesafe.ai","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"G","nome":"Revealer","cosa_fa":"OSINT service that searches a username or email address across hundreds of source modules, correlates the profiles found and checks data breach archives, showing source type, date and categories of exposed fields. Claims never to display password values.","quando_usarlo":"When you need to measure the public exposure of an identifier, starting with your own, in an assessment.","url":"https://revealer.us","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"H","nome":"SceneAI","cosa_fa":"Paid library of ready-made prompts for generating animated web sections and landing pages, updated weekly; some previews can be viewed without an account.","quando_usarlo":"When you want a proven starting point for having a page generated instead of writing the prompt from scratch.","url":"https://sceneai.art","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"B","nome":"Aside","cosa_fa":"Browser with a built-in agent that works on sites where the user already has an open session, carrying out tasks on their behalf. Claims local data processing and a password manager that authenticates without exposing credentials to the agent.","quando_usarlo":"When automation has to go through authenticated sites that don't expose an API.","url":"https://aside.com","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"E","nome":"Annota AI","cosa_fa":"Platform for preparing data for AI: image annotation, OCR with review of document text and export to COCO or Markdown, with an MCP connection that exposes the data to agents.","quando_usarlo":"When you need to turn PDFs and images into datasets or Markdown for a knowledge base.","url":"https://annota.ai","stato":"sito","lic":"sito"},{"tipo":"sito","macro":"C","nome":"Sakana AI Fugu","cosa_fa":"Sakana AI model family in two variants: Fugu Max, geared toward orchestrating and routing tasks at low inference cost, and Fugu Ultra for heavier tasks.","quando_usarlo":"When you're evaluating alternatives to US frontier models with an eye on cost per task.","url":"https://sakana.ai/fugu/","stato":"sito","lic":"sito"}]}</script>
<script>
(() => {
  // I testi del catalogo vengono da reel e pagine di terzi: si inseriscono sempre come testo
  // (textContent), mai come HTML, e i link sono ammessi solo in https.
  const META = JSON.parse(document.getElementById('dati').textContent);
  const VOCI = META.voci, T = META.ui;
  // stato e classe di licenza arrivano gia' come codici dal build: i filtri non dipendono
  // dalla lingua della pagina, le etichette si'
  const LIC = [['libera', 'ok'], ['copyleft', 'warn'], ['limitata', 'warn'], ['chiusa', 'bad'],
    ['ignota', ''], ['sito', '']];
  const COLORE = {molto_attivo: 'ok', attivo: 'ok', rallentato: 'warn', fermo: 'bad', archiviato: 'bad'};
  const cap = s => s.charAt(0).toLocaleUpperCase(META.lingua) + s.slice(1);
  const STATI = META.stati.map(([c, nome]) => [c, cap(nome), COLORE[c] || '']);
  VOCI.forEach(v => { v._testo = [v.nome, v.cosa_fa, v.quando_usarlo, v.url, v.linguaggio]
    .join(' ').toLocaleLowerCase(META.lingua); });

  const stato = {q: '', macro: null, att: null, lic: null, sort: 'stelle'};
  const $ = id => document.getElementById(id);
  const el = (tag, cls, testo) => { const e = document.createElement(tag);
    if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; };
  const k = n => n == null ? '–' : n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n);
  const NS = 'http://www.w3.org/2000/svg';
  function stella() {
    const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 16 16');
    s.setAttribute('aria-hidden', 'true'); s.setAttribute('fill', 'currentColor');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M8 .8l2.2 4.6 5 .7-3.6 3.5.9 5L8 12.2l-4.5 2.4.9-5L.8 6.1l5-.7z');
    s.append(p); return s;
  }

  function passa(v, salta) {
    if (salta !== 'macro' && stato.macro && v.macro !== stato.macro) return false;
    if (salta !== 'att' && stato.att && v.stato !== stato.att) return false;
    if (salta !== 'lic' && stato.lic && v.lic !== stato.lic) return false;
    if (stato.q) for (const p of stato.q.split(/\s+/)) if (!v._testo.includes(p)) return false;
    return true;
  }

  function opzioni(id, voci, chiave, campo, tipo) {
    const fs = $(id); [...fs.querySelectorAll('button')].forEach(b => b.remove());
    for (const [val, etichetta, colore] of voci) {
      const n = VOCI.filter(v => passa(v, chiave) && v[campo] === val).length;
      const b = el('button', 'opt'); b.type = 'button';
      b.setAttribute('aria-pressed', String(stato[chiave] === val));
      if (tipo === 'lettera') b.append(el('span', 'l', val));
      else if (tipo === 'punto') b.append(el('span', 'dot ' + colore));
      b.append(el('span', null, etichetta), el('span', 'n', String(n)));
      b.disabled = n === 0 && stato[chiave] !== val;
      b.onclick = () => { stato[chiave] = stato[chiave] === val ? null : val; render(); };
      fs.append(b);
    }
  }

  function card(v) {
    const c = el('article', 'card');
    const top = el('div', 'top');
    let url = null; try { url = new URL(v.url); } catch (e) {}
    const https = url && url.protocol === 'https:';
    const nome = el(https ? 'a' : 'span', 'name', v.nome);
    if (https) { nome.href = url.href; nome.target = '_blank'; nome.rel = 'noopener noreferrer'; }
    top.append(nome);
    if (url) top.append(el('span', 'host', url.host === 'github.com' ? url.pathname.slice(1).replace(/\/$/, '') : url.host));
    top.append(el('span', 'cat', '[' + v.macro + '] ' + (META.macro_breve[v.macro] || v.macro)));
    c.append(top, el('p', 'desc', v.cosa_fa));
    if (v.quando_usarlo) {
      const w = el('p', 'when'); w.append(el('b', null, T.quando), document.createTextNode(v.quando_usarlo));
      c.append(w);
    }
    const m = el('div', 'meta');
    const st = STATI.find(s => s[0] === v.stato) || [v.stato, v.stato, ''];
    const p1 = el('span', 'chip ' + st[2]); p1.append(el('span', 'dot ' + st[2]), document.createTextNode(st[1])); m.append(p1);
    if (v.tipo === 'repo') {
      const s = el('span', 'chip'); s.append(stella(), document.createTextNode(k(v.stelle))); m.append(s);
      if (v.ultimo_push) m.append(el('span', 'chip', 'push ' + v.ultimo_push));
      if (v.linguaggio) m.append(el('span', 'chip', v.linguaggio));
      const lc = LIC.find(x => x[0] === v.lic) || ['', ''];
      m.append(el('span', 'chip lic ' + lc[1], v.lic === 'ignota' ? T.lic_ignota : v.licenza));
    }
    if (v.origine === 'locale') m.append(el('span', 'chip mine', T.voce_tua));
    else if (v.origine === 'modificata') m.append(el('span', 'chip mine', T.modificata));
    if (v.originale) m.append(el('span', 'chip orig', T.originale));
    c.append(m);
    return c;
  }

  function conteggio(n, t) {
    // "{n} voci su {t}": il numero dei risultati in grassetto, in qualunque punto della frase
    const out = document.createDocumentFragment();
    for (const pezzo of T.conteggio.split(/(\{n\}|\{t\})/)) {
      if (pezzo === '{n}') out.append(el('b', null, String(n)));
      else if (pezzo === '{t}') out.append(String(t));
      else if (pezzo) out.append(pezzo);
    }
    return out;
  }

  function render() {
    opzioni('f-macro', META.macro.map(c => [c, META.macro_breve[c], '']), 'macro', 'macro', 'lettera');
    opzioni('f-stato', STATI, 'att', 'stato', 'punto');
    opzioni('f-lic', LIC.map(([c]) => [c, T.lic[c], '']), 'lic', 'lic');
    const out = VOCI.filter(v => passa(v));
    const s = stato.sort;
    out.sort((a, b) => s === 'nome' ? a.nome.localeCompare(b.nome, META.lingua)
      : s === 'push' ? (b.ultimo_push || '').localeCompare(a.ultimo_push || '')
      : (b.stelle ?? -1) - (a.stelle ?? -1));
    const cnt = $('count'); cnt.textContent = ''; cnt.append(conteggio(out.length, VOCI.length));
    $('reset').hidden = !(stato.q || stato.macro || stato.att || stato.lic);
    const list = $('list'); list.textContent = '';
    if (!out.length) list.append(el('div', 'empty', T.vuoto));
    const frag = document.createDocumentFragment(); out.forEach(v => frag.append(card(v))); list.append(frag);
  }

  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  const q = $('q');
  q.placeholder = T.cerca_ph; q.setAttribute('aria-label', T.cerca_aria);
  $('filtri').setAttribute('aria-label', T.filtri);
  $('titolo').textContent = META.titolo;
  $('ver').textContent = 'v' + META.verificato.replaceAll('-', '.');
  if (META.lingue.length) {
    const nav = $('lang'); nav.hidden = false; nav.setAttribute('aria-label', T.lingua);
    for (const [codice, nome, href] of META.lingue) {
      // solo percorsi relativi scritti dal build, mai un indirizzo che venga dai dati
      if (!/^(\.\.\/)?([a-z]{2}\/)?index\.html$/.test(href)) continue;
      const a = el('a', null, codice.toUpperCase()); a.href = href; a.lang = codice;
      a.title = nome; a.setAttribute('hreflang', codice);
      if (codice === META.lingua) a.setAttribute('aria-current', 'page');
      nav.append(a);
    }
  }
  const facts = $('facts');
  [[META.repo, T.repository], [META.siti, T.siti], [META.macro.length, T.categorie]].forEach(([n, t]) => {
    const s = el('span'); s.append(el('b', 'acc', String(n)), document.createTextNode(' ' + t)); facts.append(s); });
  const d = el('span'); d.append(document.createTextNode(T.verificata + ' '), el('b', null, META.verificato)); facts.append(d);
  $('foot').textContent = META.piede;

  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => { stato.q = q.value.trim().toLocaleLowerCase(META.lingua); render(); }, 120); };
  $('sort').onchange = e => { stato.sort = e.target.value; render(); };
  $('reset').onclick = () => { Object.assign(stato, {q: '', macro: null, att: null, lic: null}); q.value = ''; render(); q.focus(); };
  document.addEventListener('keydown', e => {
    const campo = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !campo) { e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === 'Escape' && document.activeElement === q && q.value) { q.value = ''; stato.q = ''; render(); }
  });
  render();
})();
</script>
</body>
</html>
