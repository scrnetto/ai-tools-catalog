# Test dell'unione fra catalogo pubblicato e voci locali (tests/test_aggiornamenti.py): un
# aggiornamento non deve mai perdere le voci dell'utente ne' fargli modificare file tracciati.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: unittest
        run: python3 -m unittest discover -s tests -v
